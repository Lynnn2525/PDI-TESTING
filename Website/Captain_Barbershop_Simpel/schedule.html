<body><header class="navbar"><div class="container nav-container"><h1 class="logo">Captain Barbershop</h1><nav><a href="index.html">Home</a><a href="bookings.html">Booking List</a><a href="login.html">Login</a></nav></div></header>
<main><section class="sub-hero"><div class="overlay"><p class="eyebrow">KHUSUS ADMIN</p><h2>Pengaturan Jadwal Barber</h2><p>Tandai waktu barber yang tidak tersedia.</p></div></section>
